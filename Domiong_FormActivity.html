<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lastname - HTML Form</title>
</head>
<body>
    <h1>HTML Form</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    required
                    placeholder="example@email.com"
                >
            </p>
        </fieldset>

        <fieldset>
            <legend>Gender</legend>

            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="male">

            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female">

            <label for="other">Other</label>
            <input type="radio" name="gender" id="other" value="other">
        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>

            <label for="reading">Reading</label>
            <input type="checkbox" name="hobbies" id="reading" value="reading">

            <label for="judo">Judo</label>
            <input type="checkbox" name="hobbies" id="judo" value="judo">

            <label for="music">Music</label>
            <input type="checkbox" name="hobbies" id="music" value="music">
        </fieldset>

        <p>
            <label for="comments">Additional Comments:</label><br>
            <textarea name="comments" id="comments" rows="5" cols="40"></textarea>
        </p>

        <p>
            <button type="submit">Submit</button>
        </p>
    </form>
</body>
</html>
